<!-- @dsCard group="Brand" height=250 subtitle="Mark, lockup, minimum sizes and app icon" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); }
  [data-theme="dark"] .on-light, :root:not([data-theme="dark"]) .on-dark { display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; margin-bottom: 24px; }
  .cap { font: 500 12px/16px var(--font-sans); letter-spacing: .2px; color: var(--ink-muted); margin: 8px 0 0; }
  .lockup { display: inline-flex; align-items: center; gap: 8px; }
  .lockup span { font: 600 28px/36px var(--font-display); color: var(--ink); }
  img { display: block; }
</style>
</head>
<body>
<div class="row">
  <div>
    <img class="on-light" src="../../assets/Logos/phoenix-mark-ink.svg" alt="Phoenix mark" height="82">
    <img class="on-dark" src="../../assets/Logos/phoenix-mark-reversed.svg" alt="Phoenix mark" height="82">
    <p class="cap">Mark</p>
  </div>
  <div>
    <div class="lockup">
      <img class="on-light" src="../../assets/Logos/phoenix-mark-ink.svg" alt="" height="28">
      <img class="on-dark" src="../../assets/Logos/phoenix-mark-reversed.svg" alt="" height="28">
      <span>Phoenix</span>
    </div>
    <p class="cap">Lockup</p>
  </div>
  <div>
    <img class="on-light" src="../../assets/Logos/phoenix-mark-accent.svg" alt="Phoenix mark, accent" height="82">
    <img class="on-dark" src="../../assets/Logos/phoenix-mark-accent-on-dark.svg" alt="Phoenix mark, accent" height="82">
    <p class="cap">Accent, once per view</p>
  </div>
</div>
<div class="row">
  <div>
    <div style="display:flex;align-items:flex-end;gap:24px">
      <span><img class="on-light" src="../../assets/Logos/phoenix-mark-ink.svg" alt="" height="48"><img class="on-dark" src="../../assets/Logos/phoenix-mark-reversed.svg" alt="" height="48"></span>
      <span><img class="on-light" src="../../assets/Logos/phoenix-mark-ink.svg" alt="" height="32"><img class="on-dark" src="../../assets/Logos/phoenix-mark-reversed.svg" alt="" height="32"></span>
      <span><img class="on-light" src="../../assets/Logos/phoenix-mark-ink.svg" alt="" height="24"><img class="on-dark" src="../../assets/Logos/phoenix-mark-reversed.svg" alt="" height="24"></span>
    </div>
    <p class="cap">48, 32 and 24px; 24px is the minimum</p>
  </div>
  <div>
    <div style="display:flex;align-items:flex-end;gap:16px">
      <img src="../../assets/Logos/phoenix-app-icon.svg" alt="Phoenix app icon" width="96" height="96">
      <img src="../../assets/Logos/phoenix-app-icon.svg" alt="" width="48" height="48">
      <img src="../../assets/Logos/phoenix-app-icon.svg" alt="" width="32" height="32">
    </div>
    <p class="cap">App icon at 96, 48 and 32px</p>
  </div>
</div>
</body>
</html>
