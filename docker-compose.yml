services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
      POSTGRES_DB: phoenix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+asyncpg://phoenix:phoenix@db:5432/phoenix
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      STT_MODEL: ${STT_MODEL:-small}
    ports: ["8000:8000"]
    volumes:
      - models:/srv/models
      - uploads:/srv/uploads

volumes:
  pgdata:
  models:
  uploads:
