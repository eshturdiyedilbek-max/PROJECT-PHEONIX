<!doctype html>
<html lang="uz" data-mode="demo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Phoenix</title>
<link rel="stylesheet" href="css/app.css">
<script>try{var s=JSON.parse(localStorage.getItem('phoenix_app_settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme;if(!s.onboarded)document.documentElement.classList.add('first-run')}catch(e){}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-talk" viewBox="0 0 24 24"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3.5V15H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9h3a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v2.5L16 18h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15ZM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 11.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c.9-3.6 3.9-5.5 7.5-5.5s6.6 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M8 4v15M8 4 4.5 7.5M8 4l3.5 3.5M16 20V5M16 20l-3.5-3.5M16 20l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11m0-6.5a1.5 1.5 0 0 1 3 0V11m0-5a1.5 1.5 0 0 1 3 0v6.5m0-4a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.8-2.4L4 14.5a1.6 1.6 0 0 1 2.4-2.1L8 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-google" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></symbol>
  <symbol id="i-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5C6.2 1.5 1.5 6.2 1.5 12c0 4.6 3 8.6 7.2 10 .5.1.7-.2.7-.5v-1.8c-2.9.6-3.5-1.4-3.5-1.4-.5-1.2-1.2-1.5-1.2-1.5-1-.7.1-.7.1-.7 1 .1 1.6 1.1 1.6 1.1.9 1.6 2.5 1.2 3.1.9.1-.7.4-1.2.7-1.4-2.3-.3-4.8-1.2-4.8-5.2 0-1.1.4-2.1 1.1-2.8-.1-.3-.5-1.4.1-2.8 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.2 0c2-1.4 2.9-1.1 2.9-1.1.6 1.4.2 2.5.1 2.8.7.8 1.1 1.7 1.1 2.8 0 4-2.5 4.9-4.8 5.2.4.3.7 1 .7 2v2.9c0 .3.2.6.7.5 4.2-1.4 7.2-5.4 7.2-10C22.5 6.2 17.8 1.5 12 1.5Z"/></symbol>
</svg>

<!-- ============ First run: sign in ============ -->
<section id="signin" class="signin" aria-labelledby="in-title" hidden>
  <div class="signin__field">
    <div class="signin__top">
      <div class="seg seg--on-red" role="group" aria-label="Til / Язык / Language" data-ui-lang></div>
    </div>
    <svg class="signin__mark" viewBox="0 14 96 82" aria-hidden="true"><path d="M46 96A46 46 0 0 0 0 50M50 96A46 46 0 0 1 96 50M76 96A76 76 0 0 0 0 20M20 96A76 76 0 0 1 96 20" fill="none" stroke="currentColor" stroke-width="12"/></svg>
    <p class="signin__brand">Phoenix</p>
    <h1 id="in-title" class="signin__title" data-i18n="in.title"></h1>
    <p class="signin__lead" data-i18n="in.lead"></p>
  </div>
  <div class="signin__actions">
    <button class="btn btn--google" type="button" data-signin="google"><svg class="ic"><use href="#i-google"/></svg><span data-i18n="in.google"></span></button>
    <button class="btn btn--github" type="button" data-signin="github"><svg class="ic"><use href="#i-github"/></svg><span data-i18n="in.github"></span></button>
    <button class="btn btn--text" type="button" id="in-skip" data-i18n="in.skip"></button>
    <p class="signin__why" data-i18n="in.why"></p>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app" class="app" hidden>

  <!-- Talk: face to face -->
  <section class="screen talk" data-screen="talk" aria-label="Suhbat">
    <header class="appbar appbar--talk">
      <h1 class="appbar__title">Phoenix</h1>
      <span class="demo-tag" data-i18n="demo.tag"></span>
      <button class="chip" type="button" id="pick-sign" aria-haspopup="dialog"><svg class="ic ic--sm"><use href="#i-hand"/></svg><span id="sign-short">RSL</span></button>
      <button class="chip" type="button" id="pick-target" aria-haspopup="dialog"><span id="target-short">UZ</span></button>
    </header>

    <div class="split" id="split">
      <!-- far half: turned 180° for the person across -->
      <div class="half half--far" id="half-far"></div>
      <!-- the red line -->
      <div class="line" id="line">
        <p class="line__status" id="status" role="status" aria-live="polite"></p>
        <button class="fab" type="button" id="btn-main"><svg class="ic"><use href="#i-play"/></svg><span id="btn-main-label" data-i18n="talk.start"></span></button>
        <div class="line__tools">
          <button class="icon-btn icon-btn--on-red" type="button" id="btn-flip" data-i18n-aria="talk.flip"><svg class="ic"><use href="#i-flip"/></svg></button>
          <button class="icon-btn icon-btn--on-red" type="button" id="btn-end" data-i18n-aria="talk.end" hidden><svg class="ic"><use href="#i-close"/></svg></button>
        </div>
      </div>
      <!-- near half: the holder's side -->
      <div class="half half--near" id="half-near"></div>
    </div>

    <!-- the two panels; JS moves them into the halves depending on who holds the phone -->
    <template id="tpl-panels">
      <div class="panel panel--hearing" data-panel="hearing">
        <p class="panel__label" data-i18n="talk.signedTitle"></p>
        <p class="said said--empty" id="sentence" data-i18n="talk.signedEmpty"></p>
        <p class="panel__meta" id="sentence-meta"></p>
        <div class="panel__actions">
          <button class="btn btn--tonal" type="button" id="btn-mic" aria-pressed="false"><svg class="ic"><use href="#i-mic"/></svg><span id="mic-label" data-i18n="talk.mic"></span><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
          <button class="icon-btn" type="button" id="btn-say" data-i18n-aria="talk.say" disabled><svg class="ic"><use href="#i-speaker"/></svg></button>
        </div>
      </div>
      <div class="panel panel--signer" data-panel="signer">
        <p class="panel__label" data-i18n="talk.saidTitle"></p>
        <div class="said said--empty" id="subtitles"><span data-i18n="talk.saidEmpty"></span></div>
        <div class="signs">
          <p class="panel__label panel__label--small" data-i18n="talk.yourSigns"></p>
          <ol class="words" id="words" aria-live="polite"></ol>
          <button class="icon-btn icon-btn--small" type="button" id="btn-reset" data-i18n-aria="talk.reset" disabled><svg class="ic"><use href="#i-clear"/></svg></button>
        </div>
      </div>
      <figure class="cam" id="cam-box">
        <video id="cam" playsinline muted autoplay hidden></video>
        <div class="cam__empty" id="cam-empty"><svg class="ic"><use href="#i-hand"/></svg></div>
        <figcaption class="cam__pill"><i class="dot" id="cam-dot"></i><span id="cam-state" data-i18n="talk.camOff"></span></figcaption>
      </figure>
    </template>
    <p class="holder-note" id="holder-note"></p>
  </section>

  <!-- Dictionary -->
  <section class="screen" data-screen="dict" hidden>
    <header class="appbar"><h1 class="appbar__title" data-i18n="dict.title"></h1><span class="demo-tag" data-i18n="demo.tag"></span></header>
    <div class="screen__body">
      <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="dict-q" type="search" enterkeyhint="search" autocomplete="off" data-i18n-ph="dict.search"></label>
      <div class="seg seg--full" role="group" id="dict-lang">
        <button type="button" data-v="rsl" data-i18n="sign.rsl"></button>
        <button type="button" data-v="asl" data-i18n="sign.asl"></button>
      </div>
      <div class="chips" role="group" id="dict-cat">
        <button class="chip" type="button" data-v="" data-i18n="dict.all"></button>
        <button class="chip" type="button" data-v="word" data-i18n="dict.word"></button>
        <button class="chip" type="button" data-v="phrase" data-i18n="dict.phrase"></button>
        <button class="chip" type="button" data-v="letter" data-i18n="dict.letter"></button>
      </div>
      <p class="hint" id="dict-hint"></p>
      <ul class="list list--dict" id="dict-list"></ul>
      <p class="empty-line" id="dict-empty" hidden></p>
      <button class="btn btn--outline btn--block" type="button" id="dict-more" data-i18n="dict.more" hidden></button>
    </div>
  </section>

  <!-- History -->
  <section class="screen" data-screen="history" hidden>
    <header class="appbar"><h1 class="appbar__title" data-i18n="hist.title"></h1><span class="demo-tag" data-i18n="demo.tag"></span>
      <button class="icon-btn" type="button" id="hist-clear" data-i18n-aria="hist.clear" hidden><svg class="ic"><use href="#i-trash"/></svg></button></header>
    <div class="screen__body">
      <p class="hint" id="hist-where"></p>
      <div id="hist-list"></div>
      <div class="empty" id="hist-empty" hidden>
        <svg class="empty__art" viewBox="0 0 160 96" aria-hidden="true"><rect x="8" y="10" width="92" height="30" rx="15" fill="var(--red-tint)"/><rect x="60" y="54" width="92" height="30" rx="15" fill="none" stroke="var(--line-strong)" stroke-width="2"/><path d="M0 48h160" stroke="var(--red)" stroke-width="3"/></svg>
        <h2 class="empty__t" data-i18n="hist.emptyT"></h2>
        <p class="empty__p" data-i18n="hist.emptyP"></p>
        <button class="btn btn--filled" type="button" data-go="talk" data-i18n="hist.toTalk"></button>
      </div>
      <div class="empty" id="hist-error" hidden>
        <p class="empty__p" data-i18n="hist.error"></p>
        <button class="btn btn--outline" type="button" id="hist-retry" data-i18n="hist.retry"></button>
      </div>
    </div>
  </section>

  <!-- Profile & settings -->
  <section class="screen" data-screen="me" hidden>
    <header class="appbar"><h1 class="appbar__title" data-i18n="me.title"></h1><span class="demo-tag" data-i18n="demo.tag"></span></header>
    <div class="screen__body">
      <div class="account" id="account"></div>

      <h2 class="group-title" data-i18n="me.translate"></h2>
      <ul class="list list--settings">
        <li><button class="row" type="button" id="row-sign"><span class="row__t" data-i18n="talk.signLang"></span><span class="row__v" id="v-sign"></span><svg class="ic ic--sm"><use href="#i-chev"/></svg></button></li>
        <li><button class="row" type="button" id="row-target"><span class="row__t" data-i18n="talk.target"></span><span class="row__v" id="v-target"></span><svg class="ic ic--sm"><use href="#i-chev"/></svg></button></li>
        <li><button class="row" type="button" id="row-speech"><span class="row__t" data-i18n="me.speechLang"></span><span class="row__v" id="v-speech"></span><svg class="ic ic--sm"><use href="#i-chev"/></svg></button></li>
        <li><label class="row"><span class="row__t" data-i18n="me.voice"></span><input class="switch" type="checkbox" data-set="voice"></label></li>
        <li><label class="row" id="row-smooth"><span class="row__t" data-i18n="me.smooth"></span><input class="switch" type="checkbox" data-set="smooth"></label></li>
        <li><label class="row"><span class="row__t" data-i18n="me.save"></span><input class="switch" type="checkbox" data-set="saveHistory"></label></li>
      </ul>

      <h2 class="group-title" data-i18n="me.server"></h2>
      <div class="field">
        <label class="field__label" for="api" data-i18n="me.api"></label>
        <div class="field__row">
          <input id="api" class="input" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://….trycloudflare.com">
          <button class="btn btn--tonal" type="button" id="api-check" data-i18n="me.check"></button>
        </div>
        <p class="field__hint" id="api-hint" data-i18n="me.apiHint"></p>
      </div>
      <div class="field">
        <p class="field__label" data-i18n="me.mode"></p>
        <div class="seg seg--full" role="group" id="mode-seg">
          <button type="button" data-v="auto" data-i18n="me.modeAuto"></button>
          <button type="button" data-v="live" data-i18n="me.modeLive"></button>
          <button type="button" data-v="demo" data-i18n="me.modeDemo"></button>
        </div>
      </div>

      <h2 class="group-title" data-i18n="me.app"></h2>
      <div class="field">
        <p class="field__label" data-i18n="me.uiLang"></p>
        <div class="seg seg--full" role="group" data-ui-lang></div>
      </div>
      <div class="field">
        <p class="field__label" data-i18n="me.theme"></p>
        <div class="seg seg--full" role="group" id="theme-seg">
          <button type="button" data-v="system" data-i18n="me.system"></button>
          <button type="button" data-v="light" data-i18n="me.light"></button>
          <button type="button" data-v="dark" data-i18n="me.dark"></button>
        </div>
      </div>

      <h2 class="group-title" data-i18n="me.about"></h2>
      <p class="about" data-i18n="me.privacy"></p>
      <p class="about about--muted" id="version"></p>
    </div>
  </section>

  <!-- Material navigation bar -->
  <nav class="navbar" aria-label="Phoenix">
    <a href="#talk" data-tab="talk"><span class="navbar__pill"><svg class="ic"><use href="#i-talk"/></svg></span><span data-i18n="nav.talk"></span></a>
    <a href="#dict" data-tab="dict"><span class="navbar__pill"><svg class="ic"><use href="#i-book"/></svg></span><span data-i18n="nav.dict"></span></a>
    <a href="#history" data-tab="history"><span class="navbar__pill"><svg class="ic"><use href="#i-clock"/></svg></span><span data-i18n="nav.history"></span></a>
    <a href="#me" data-tab="me"><span class="navbar__pill"><svg class="ic"><use href="#i-person"/></svg></span><span data-i18n="nav.me"></span></a>
  </nav>
</div>

<!-- Bottom sheet (choices, GitHub code) -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <span class="sheet__handle" aria-hidden="true"></span>
  <h2 class="sheet__title" id="sheet-title"></h2>
  <div class="sheet__body" id="sheet-body"></div>
</div>

<div class="snackbar" id="snack" role="status" aria-live="polite" hidden><span id="snack-text"></span><button type="button" id="snack-act" hidden></button></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
