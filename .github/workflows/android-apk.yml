# Builds the Phoenix Android app (APK) from frontend/ + app/.
# - Every pull request and push: the APK is attached to the run as an artifact.
# - Every push to main: the APK is also published as a GitHub Release, easy to download on a phone.
name: Android APK

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['frontend/**', 'app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        working-directory: app
        run: npm ci

      - name: Copy the website into the app
        working-directory: app
        run: npm run sync

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Phoenix-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Phoenix-apk-${{ github.run_number }}
          path: Phoenix-${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "Phoenix-${{ github.run_number }}.apk" \
            --title "Phoenix ilovasi (Android) #${{ github.run_number }}" \
            --notes "Telefonga yuklab olib o'rnating: Phoenix-${{ github.run_number }}.apk. Commit ${{ github.sha }}." \
            --latest
